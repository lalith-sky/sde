<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Button Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      background: #0a0b0f;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #counter {
      font-size: 48px;
      font-weight: bold;
      padding: 20px 40px;
      background: #ff4d6a;
      border-radius: 12px;
      transition: background 0.3s;
    }
    #counter.active {
      background: #00e5a0;
      color: #000;
    }
    button {
      padding: 20px 40px;
      font-size: 24px;
      background: #7c5cfc;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    button:active {
      transform: scale(0.95);
    }
    .badge {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #00e5a0;
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
    }
    .info {
      max-width: 500px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="badge">PURE HTML ✓</div>
  
  <h1 style="font-size: 36px;">Direct HTML Button Test</h1>
  
  <div id="counter">CLICKS: 0</div>
  
  <button id="testButton">CLICK ME!</button>
  
  <div class="info">
    <strong>This is pure HTML + JavaScript</strong><br>
    No React, no frameworks, no build tools.<br><br>
    If this button works → Your browser is fine<br>
    If this button doesn't work → Browser/system issue
  </div>

  <script>
    let count = 0;
    const counterEl = document.getElementById('counter');
    const button = document.getElementById('testButton');
    
    console.log('✅ Direct HTML test page loaded');
    console.log('Counter element:', counterEl);
    console.log('Button element:', button);
    
    button.addEventListener('click', function() {
      count++;
      console.log('🔘 Button clicked! Count:', count);
      counterEl.textContent = 'CLICKS: ' + count;
      if (count > 0) {
        counterEl.classList.add('active');
      }
    });
    
    // Test if addEventListener is working
    button.addEventListener('mouseenter', function() {
      console.log('👆 Mouse entered button area');
    });
    
    console.log('✅ Event listeners attached successfully');
  </script>
</body>
</html>
