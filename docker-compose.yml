version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: visual_ai_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - visual_ai_network

  # Backend Express Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: visual_ai_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/visual-ai-agent
      - JWT_SECRET=super_secret_visual_ai_agent_token_key_123456
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=production
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    restart: unless-stopped
    networks:
      - visual_ai_network

  # Frontend Dashboard Web Client
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: visual_ai_dashboard
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - visual_ai_network

volumes:
  mongo_data:
  uploads_data:
  logs_data:

networks:
  visual_ai_network:
    driver: bridge
