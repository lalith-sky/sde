name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install Backend Dependencies
      working-directory: ./server
      run: npm ci
    
    - name: Run Backend Tests
      working-directory: ./server
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/test
        JWT_SECRET: test_secret_key
        NODE_ENV: test

  # Backend Build
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install Dependencies
      working-directory: ./server
      run: npm ci
    
    - name: Build Backend
      working-directory: ./server
      run: npm run build
    
    - name: Upload Backend Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-build
        path: server/dist

  # Dashboard Build
  dashboard-build:
    name: Dashboard Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
    
    - name: Install Dependencies
      working-directory: ./dashboard
      run: npm ci
    
    - name: Build Dashboard
      working-directory: ./dashboard
      run: npm run build
    
    - name: Upload Dashboard Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: dashboard-build
        path: dashboard/dist

  # Extension Build
  extension-build:
    name: Extension Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json
    
    - name: Install Dependencies
      working-directory: ./extension
      run: npm ci
    
    - name: Build Extension
      working-directory: ./extension
      run: npm run build
    
    - name: Upload Extension Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: extension-build
        path: extension/dist

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-build, dashboard-build]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Backend Docker Image
      working-directory: ./server
      run: docker build -t visual-ai-backend:test .
    
    - name: Build Dashboard Docker Image
      working-directory: ./dashboard
      run: docker build -t visual-ai-dashboard:test .
    
    - name: Test Docker Compose
      run: docker-compose config

  # Code Quality Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
    
    - name: Check TypeScript in Server
      working-directory: ./server
      run: |
        npm ci
        npx tsc --noEmit
    
    - name: Check TypeScript in Dashboard
      working-directory: ./dashboard
      run: |
        npm ci
        npx tsc --noEmit
    
    - name: Check TypeScript in Extension
      working-directory: ./extension
      run: |
        npm ci
        npx tsc --noEmit
